{% extends "base.html" %}
{% block title %}Настройки архива{% endblock %}

{% block content %}
<h1 class="page-title">Настройки архивирования</h1>

{% include "settings/_nav.html" %}

<div class="form-section">
  <div class="form-section__title">Состояние Archive Manager</div>
  <div id="archive-status" class="text-muted">Загрузка...</div>
  <div class="compact-actions mt-2">
    <button class="btn btn-secondary btn-sm" onclick="loadArchiveStatus()">Обновить статус</button>
    <button class="btn btn-secondary btn-sm" onclick="captureArchive()">Снять текущий срез</button>
    <button class="btn btn-danger btn-sm" onclick="cleanupArchive()">Очистить по политике хранения</button>
  </div>
</div>

<div class="form-section">
  <div class="form-section__title">Режим забора данных</div>
  <div class="form-group">
    <label>Режим</label>
    <select id="a-mode">
      <option value="periodic" {{ 'selected' if archive.data_collection.mode == 'periodic' }}>По таймеру (periodic)</option>
      <option value="watch" {{ 'selected' if archive.data_collection.mode == 'watch' }}>По изменению (watch)</option>
      <option value="combined" {{ 'selected' if archive.data_collection.mode == 'combined' }}>Комбинированный (combined)</option>
    </select>
  </div>
</div>

<div class="form-section">
  <div class="form-section__title">Хранилище SQLite</div>
  <div class="form-row">
    <div class="form-group">
      <label><input type="checkbox" id="a-sqlite-on" {{ 'checked' if archive.storage.sqlite.enabled }}> Включено</label>
    </div>
    <div class="form-group">
      <label>Макс. размер (МБ)</label>
      <input type="number" id="a-sqlite-max" value="{{ archive.storage.sqlite.max_size_mb }}">
    </div>
  </div>
</div>

<div class="form-section">
  <div class="form-section__title">Компрессия</div>
  <div class="form-row">
    <div class="form-group">
      <label><input type="checkbox" id="a-comp-on" {{ 'checked' if archive.compression.enabled }}> Включена</label>
    </div>
    <div class="form-group">
      <label>Допуск T (°C)</label>
      <input type="number" id="a-comp-t" step="0.01" value="{{ archive.compression.tolerance_temp }}">
    </div>
    <div class="form-group">
      <label>Допуск H (%)</label>
      <input type="number" id="a-comp-h" step="0.1" value="{{ archive.compression.tolerance_hum }}">
    </div>
  </div>
</div>

<div class="form-section">
  <div class="form-section__title">Ротация</div>
  <div class="form-row">
    <div class="form-group">
      <label>Хранить (дней)</label>
      <input type="number" id="a-ret-days" value="{{ archive.retention.max_days }}">
    </div>
    <div class="form-group">
      <label>Мин. свободного места (МБ)</label>
      <input type="number" id="a-ret-space" value="{{ archive.retention.min_free_space_mb }}">
    </div>
  </div>
</div>

<button class="btn btn-primary" onclick="saveArchive()">Сохранить</button>
{% endblock %}

{% block scripts %}
<script>
function archiveConfigFromForm() {
  return {
    data_collection: {
      mode: document.getElementById('a-mode').value
    },
    storage: {
      sqlite: {
        enabled: document.getElementById('a-sqlite-on').checked,
        max_size_mb: parseInt(document.getElementById('a-sqlite-max').value || '500')
      }
    },
    compression: {
      enabled: document.getElementById('a-comp-on').checked,
      tolerance_temp: parseFloat(document.getElementById('a-comp-t').value || '0.1'),
      tolerance_hum: parseFloat(document.getElementById('a-comp-h').value || '0.5')
    },
    retention: {
      max_days: parseInt(document.getElementById('a-ret-days').value || '365'),
      min_free_space_mb: parseInt(document.getElementById('a-ret-space').value || '200')
    }
  };
}

async function saveArchive() {
  try {
    await apiFetch('/api/archive/config', {method: 'POST', body: JSON.stringify(archiveConfigFromForm())});
    showToast('Настройки архива сохранены');
    loadArchiveStatus();
  } catch(e) {}
}

async function loadArchiveStatus() {
  try {
    var status = await apiFetch('/api/archive/status');
    document.getElementById('archive-status').innerHTML =
      'Статус: <b>' + status.status + '</b>' +
      ' · датчиков: <b>' + status.sensor_count + '</b>' +
      ' · записей: <b>' + status.measurement_count + '</b>' +
      ' · archive.json: <b>' + Math.round((status.json_size_bytes || 0) / 1024) + ' КБ</b>' +
      ' · archive_daily дней: <b>' + status.daily_days + '</b>' +
      ' · свободно: <b>' + status.disk_free_mb + ' МБ</b>';
  } catch(e) {}
}

async function captureArchive() {
  try {
    await apiFetch('/api/archive/capture', {method: 'POST', body: '{}'});
    showToast('Срез сохранён');
    loadArchiveStatus();
  } catch(e) {}
}

async function cleanupArchive() {
  if (!confirm('Очистить архив по текущей политике хранения?')) return;
  try {
    await apiFetch('/api/archive/cleanup', {method: 'POST', body: '{}'});
    showToast('Очистка выполнена');
    loadArchiveStatus();
  } catch(e) {}
}

loadArchiveStatus();
</script>
{% endblock %}
