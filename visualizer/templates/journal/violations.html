{% extends "base.html" %}
{% block title %}Журнал превышений{% endblock %}

{% block head %}
<style>
  .filter-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .filter-bar select, .filter-bar input {
    padding: 6px 10px; background: var(--bg-input); border: 1px solid var(--border-color);
    border-radius: 6px; color: var(--text-primary); font-size: 13px;
  }
  .level-alarm { color: var(--color-alarm); font-weight: 600; }
  .level-warning { color: var(--color-warning); font-weight: 600; }
  .btn-ack { padding: 3px 10px; font-size: 11px; background: var(--color-guarded); color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  .btn-ack:hover { opacity: .85; }
  .stats-bar { display: flex; gap: 20px; margin-bottom: 16px; font-size: 13px; color: var(--text-secondary); }
  .stats-bar span { font-weight: 600; color: var(--text-primary); }
</style>
{% endblock %}

{% block content %}
<h1 class="page-title">Журнал превышений</h1>
{% include "journal/_nav.html" %}

<div class="form-section">
  <div class="filter-bar">
    <select id="f-sensor" aria-label="Фильтр по датчику">
      <option value="">Все датчики</option>
    </select>
    <label style="font-size:13px;color:var(--text-secondary)">С:</label>
    <input type="date" id="f-from" aria-label="Дата начала">
    <label style="font-size:13px;color:var(--text-secondary)">По:</label>
    <input type="date" id="f-to" aria-label="Дата окончания">
    <select id="f-limit" aria-label="Количество записей">
      <option value="30">30</option>
      <option value="50" selected>50</option>
      <option value="100">100</option>
    </select>
    <button class="btn btn-primary btn-sm" onclick="loadViolations()">Обновить</button>
  </div>
</div>

<div class="form-section">
  <div class="stats-bar" id="stats-bar"></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Время</th>
          <th>Датчик</th>
          <th>Параметр</th>
          <th>Тип</th>
          <th>Значение</th>
          <th>Описание</th>
          <th>Статус</th>
        </tr>
      </thead>
      <tbody id="viol-body">
        <tr><td colspan="7" class="text-muted">Загрузка...</td></tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadSensorFilter() {
  try {
    var sensors = await apiFetch('/api/sensors');
    var sel = document.getElementById('f-sensor');
    sensors.forEach(function(s) {
      var opt = document.createElement('option');
      opt.value = s.id; opt.textContent = s.name;
      sel.appendChild(opt);
    });
  } catch(e) {}
}

async function loadViolations() {
  var sensorId = document.getElementById('f-sensor').value;
  var dateFrom = document.getElementById('f-from').value;
  var dateTo = document.getElementById('f-to').value;
  var limit = document.getElementById('f-limit').value;

  var url = '/api/journal/violations?limit=' + limit;
  if (sensorId) url += '&sensor_id=' + sensorId;
  if (dateFrom) url += '&from=' + dateFrom + 'T00:00:00';
  if (dateTo) url += '&to=' + dateTo + 'T23:59:59';

  try {
    var resp = await apiFetch(url);
    var violations = resp.violations || [];
    var tbody = document.getElementById('viol-body');
    var statsBar = document.getElementById('stats-bar');

    var totalCount = resp.total || 0;
    var alarms = violations.filter(function(v) { return v.level === 'alarm'; }).length;
    var warnings = violations.filter(function(v) { return v.level === 'warning'; }).length;
    var unacked = violations.filter(function(v) { return !v.acknowledged; }).length;
    statsBar.innerHTML = 'Всего: <span>' + totalCount + '</span> &nbsp;|&nbsp; Тревоги: <span style="color:var(--color-alarm)">' + alarms + '</span> &nbsp;|&nbsp; Предупреждения: <span style="color:var(--color-warning)">' + warnings + '</span> &nbsp;|&nbsp; Не квитировано: <span>' + unacked + '</span>';

    if (!violations.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-muted">Нет превышений по заданным фильтрам</td></tr>';
      return;
    }

    tbody.innerHTML = violations.map(function(v) {
      var dt = new Date(v.timestamp).toLocaleString('ru-RU');
      var levelClass = v.level === 'alarm' ? 'level-alarm' : 'level-warning';
      var levelText = v.level === 'alarm' ? 'АВАРИЯ' : 'Предупреждение';
      var paramText = v.parameter === 'temperature' ? 'Температура' : 'Влажность';
      var dirText = v.direction === 'high' ? '↑ Выше нормы' : '↓ Ниже нормы';
      var unit = v.parameter === 'temperature' ? '°C' : '%';
      var ack;
      if (v.acknowledged) {
        ack = '<span style="color:var(--color-normal)">✓ ' + new Date(v.acknowledged_at).toLocaleString('ru-RU') + '</span>';
      } else {
        ack = '<button class="btn-ack" onclick="ackViolation(' + v.id + ')">Квитировать</button>';
      }

      return '<tr>' +
        '<td>' + dt + '</td>' +
        '<td>Датчик ' + v.sensor_id + '</td>' +
        '<td>' + paramText + '</td>' +
        '<td class="' + levelClass + '">' + levelText + ' ' + dirText + '</td>' +
        '<td style="font-weight:600">' + v.value + unit + '</td>' +
        '<td>' + v.message + '</td>' +
        '<td>' + ack + '</td>' +
        '</tr>';
    }).join('');
  } catch(e) {}
}

async function ackViolation(id) {
  try {
    await apiFetch('/api/journal/violations/' + id + '/ack', { method: 'POST', body: JSON.stringify({}) });
    showToast('Превышение квитировано');
    loadViolations();
  } catch(e) {}
}

loadSensorFilter();
loadViolations();
</script>
{% endblock %}
