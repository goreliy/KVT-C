{% extends "base.html" %}
{% block title %}Журнал событий{% endblock %}

{% block head %}
<style>
  .filter-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .filter-bar select, .filter-bar input {
    padding: 6px 10px; background: var(--bg-input); border: 1px solid var(--border-color);
    border-radius: 6px; color: var(--text-primary); font-size: 13px;
  }
  .event-row { display: flex; gap: 16px; padding: 10px 12px; border-bottom: 1px solid var(--border-color); align-items: center; font-size: 13px; }
  .event-row:hover { background: rgba(255,255,255,.03); }
  .event-icon { font-size: 18px; flex-shrink: 0; width: 28px; text-align: center; }
  .event-time { color: var(--text-secondary); min-width: 150px; white-space: nowrap; }
  .event-sensor { min-width: 110px; color: var(--color-guarded); }
  .event-msg { flex: 1; }
  .event-val { font-weight: 600; }
  .event-ack { min-width: 140px; text-align: right; }
  .btn-ack { padding: 3px 10px; font-size: 11px; background: var(--color-guarded); color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  .btn-ack:hover { opacity: .85; }
  .stats-bar { display: flex; gap: 20px; margin-bottom: 16px; font-size: 13px; color: var(--text-secondary); }
  .stats-bar span { font-weight: 600; color: var(--text-primary); }
</style>
{% endblock %}

{% block content %}
<h1 class="page-title">Журнал событий</h1>
{% include "journal/_nav.html" %}

<div class="form-section">
  <div class="filter-bar">
    <select id="f-sensor" aria-label="Фильтр по датчику">
      <option value="">Все датчики</option>
    </select>
    <select id="f-type" aria-label="Фильтр по типу">
      <option value="">Все типы</option>
      <option value="alarm">Тревоги</option>
      <option value="warning">Предупреждения</option>
    </select>
    <label style="font-size:13px;color:var(--text-secondary)">С:</label>
    <input type="date" id="f-from" aria-label="Дата начала">
    <label style="font-size:13px;color:var(--text-secondary)">По:</label>
    <input type="date" id="f-to" aria-label="Дата окончания">
    <select id="f-limit" aria-label="Количество записей">
      <option value="30">30</option>
      <option value="50" selected>50</option>
      <option value="100">100</option>
      <option value="200">200</option>
    </select>
    <button class="btn btn-primary btn-sm" onclick="loadEvents()">Обновить</button>
  </div>
</div>

<div class="form-section">
  <div class="stats-bar" id="stats-bar"></div>
  <div id="events-container">
    <p class="text-muted">Загрузка...</p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadSensorFilter() {
  try {
    const sensors = await apiFetch('/api/sensors');
    const sel = document.getElementById('f-sensor');
    sensors.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id; opt.textContent = s.name;
      sel.appendChild(opt);
    });
  } catch(e) {}
}

async function loadEvents() {
  const sensorId = document.getElementById('f-sensor').value;
  const type = document.getElementById('f-type').value;
  const dateFrom = document.getElementById('f-from').value;
  const dateTo = document.getElementById('f-to').value;
  const limit = document.getElementById('f-limit').value;

  let url = '/api/journal/events?limit=' + limit;
  if (sensorId) url += '&sensor_id=' + sensorId;
  if (type) url += '&type=' + type;
  if (dateFrom) url += '&from=' + dateFrom + 'T00:00:00';
  if (dateTo) url += '&to=' + dateTo + 'T23:59:59';

  try {
    const resp = await apiFetch(url);
    const events = resp.events || [];
    const container = document.getElementById('events-container');
    const statsBar = document.getElementById('stats-bar');

    const totalCount = resp.total || 0;
    const unacked = events.filter(e => !e.acknowledged).length;
    const alarms = events.filter(e => e.event_type && e.event_type.includes('alarm')).length;
    statsBar.innerHTML = 'Всего: <span>' + totalCount + '</span> &nbsp;|&nbsp; Не квитировано: <span style="color:var(--color-warning)">' + unacked + '</span> &nbsp;|&nbsp; Тревоги: <span style="color:var(--color-alarm)">' + alarms + '</span>';

    if (!events.length) {
      container.innerHTML = '<p class="text-muted">Нет событий по заданным фильтрам</p>';
      return;
    }

    container.innerHTML = events.map(function(e) {
      var icon = (e.event_type && e.event_type.includes('alarm')) ? '🚨' : '⚠️';
      var dt = new Date(e.timestamp).toLocaleString('ru-RU');
      var ack;
      if (e.acknowledged) {
        ack = '<span style="color:var(--color-normal)">✓ ' + new Date(e.acknowledged_at).toLocaleString('ru-RU') + '</span>';
      } else {
        ack = '<button class="btn-ack" onclick="ackEvent(' + e.id + ')">Квитировать</button>';
      }
      var priorityColor = e.priority === 'high' ? 'var(--color-alarm)' : 'var(--color-warning)';
      var valStr = e.value != null ? ' ' + e.value + '°C' : '';

      return '<div class="event-row">' +
        '<span class="event-icon">' + icon + '</span>' +
        '<span class="event-time">' + dt + '</span>' +
        '<span class="event-sensor">Датчик ' + e.sensor_id + '</span>' +
        '<span class="event-msg">' + (e.message || '') + '<span class="event-val" style="color:' + priorityColor + '">' + valStr + '</span></span>' +
        '<span class="event-ack">' + ack + '</span>' +
        '</div>';
    }).join('');
  } catch(e) {}
}

async function ackEvent(eventId) {
  try {
    await apiFetch('/api/journal/events/' + eventId + '/ack', { method: 'POST', body: JSON.stringify({}) });
    showToast('Событие квитировано');
    loadEvents();
  } catch(e) {}
}

loadSensorFilter();
loadEvents();
</script>
{% endblock %}
